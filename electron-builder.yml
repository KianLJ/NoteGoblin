appId: com.notegoblin.app
productName: NoteGoblin
directories:
  buildResources: build
files:
  - out/**/*
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
asarUnpack:
  - resources/**
win:
  target: nsis
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
# electron-updater's feed — publishing (uploading the built installer + the
# latest.yml update manifest it generates) requires a GH_TOKEN env var with
# repo scope; just building normally (no --publish flag) never touches this.
publish:
  provider: github
  owner: KianLJ
  repo: NoteGoblin
