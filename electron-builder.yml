appId: com.notegoblin.app
productName: NoteGoblin
directories:
  buildResources: build
files:
  - out/**/*
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
asarUnpack:
  # The bundled audio left in the app (dice/UI sounds — Vite emits these flat
  # into out/renderer/assets) lives outside app.asar so an update's blockmap
  # diff only touches files that changed. The music, ambience and Sound Board
  # audio aren't in the installer at all: they're streamed or downloaded from
  # the relay (src/main/libraryAudio.ts, uploaded by `npm run library:upload`).
  - out/renderer/assets/*.mp3
  - resources/**
# Chromium ships ~55 UI language packs (~39MB); the app is English-only, so keep just English.
electronLanguages:
  - en-US
  - en-GB
win:
  target: nsis
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # Branded art for the installer's pages, drawn by build/make-installer-art.py
  # from the logo in the app's colours (rerun it if the logo changes).
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/uninstallerSidebar.bmp
  installerHeader: build/installerHeader.bmp
# electron-updater's feed — publishing (uploading the built installer + the
# latest.yml update manifest it generates) requires a GH_TOKEN env var with
# repo scope; just building normally (no --publish flag) never touches this.
publish:
  provider: github
  owner: KianLJ
  repo: NoteGoblin
  # electron-builder defaults to creating GitHub releases as drafts (meant
  # for a human to review and publish manually) — drafts are invisible to
  # electron-updater's feed, so without this, `release:win` would silently
  # upload a release nobody's installed app can ever see. Publish outright.
  releaseType: release
